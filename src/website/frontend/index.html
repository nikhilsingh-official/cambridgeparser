<!DOCTYPE html>
<html lang="en" data-theme-storage="cambridge-ide-theme">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practice Cambridge 9618 pseudocode with compiler and mark-scheme feedback.">
    <meta name="theme-color" content="#faf8f3">
    <!-- Runs before CSS to prevent a wrong-theme flash; theme.js adopts this result. -->
    <script>
      try {
        const savedTheme = localStorage.getItem(document.documentElement.dataset.themeStorage)
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (prefersDark ? 'dark' : 'light')
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&amp;display=swap"
    >
    <title>Pseudocode — Cambridge 9618 Practice</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
